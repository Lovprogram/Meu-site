<!DOCTYPE html>
<html>
<head>
<style>
body {
    background: black;
    color: lime;
    margin: 0;
    overflow: hidden;
}

#saida {
    font-size: 8vw;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>

<pre id="saida"></pre>

<script>
const texto = "N̷̢̬̟͙̞̹̦̪̒̋NiggaNigga";

const saida = document.getElementById("saida");

setInterval(() => {
    saida.textContent += texto + "\n";
    window.scrollTo(0, document.body.scrollHeight);
}, 100);
</script>

</body>
</html>
