<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    background: black;
    color: #00ff00;
    overflow: hidden;
    font-family: monospace;
}

#terminal {
    font-size: 5vw;
    text-shadow: 0 0 10px #00ff00;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div id="terminal"></div>

<script>
const texto = "N̷̢̬̟͙̞̹̦̪̒̋NiggaNigga";

const tela = document.getElementById("terminal");

setInterval(() => {
    tela.innerHTML += texto + "<br>";

    // mantém efeito infinito sem congelar
    if (tela.innerHTML.length > 10000) {
        tela.innerHTML = "";
    }

    window.scrollTo(0, document.body.scrollHeight);
}, 50);
</script>

</body>
</html>
